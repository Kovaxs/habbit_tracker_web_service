---
- name: Deploy Habit Tracker to the Docker VM
  hosts: docker
  become: true
  gather_facts: false

  vars:
    app_source_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ habit_tracker_deploy_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy application build files
      ansible.builtin.copy:
        src: "{{ app_source_dir }}/{{ item }}"
        dest: "{{ habit_tracker_deploy_dir }}/{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      loop:
        - .dockerignore
        - Dockerfile
        - docker-compose.yml
        - package.json
        - package-lock.json
        - next.config.ts
        - tsconfig.json
        - components.json
        - eslint.config.mjs
        - postcss.config.mjs
        - drizzle.config.ts

    - name: Remove replaced source directories
      ansible.builtin.file:
        path: "{{ habit_tracker_deploy_dir }}/{{ item }}"
        state: absent
      loop:
        - src
        - drizzle

    - name: Copy application source and database migrations
      ansible.builtin.copy:
        src: "{{ app_source_dir }}/{{ item }}/"
        dest: "{{ habit_tracker_deploy_dir }}/{{ item }}/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        directory_mode: "0755"
      loop:
        - src
        - drizzle

    - name: Configure the application time zone
      ansible.builtin.template:
        src: habit-tracker.env.j2
        dest: "{{ habit_tracker_deploy_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Build and start the application container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - --detach
          - --build
          - --remove-orphans
        chdir: "{{ habit_tracker_deploy_dir }}"
      register: compose_up
      changed_when: true

    - name: Wait for the application to respond
      ansible.builtin.uri:
        url: http://192.168.5.214:3000/
        status_code: 200
        return_content: false
        timeout: 10
      register: application_response
      until: application_response.status == 200
      retries: 12
      delay: 5
